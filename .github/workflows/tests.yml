name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements_test.txt
      - name: Run unit tests
        run: python -m pytest
